<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR 晕动风险评估系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>VR 晕动风险评估系统</h1>
  <div id="support"></div>
</header>

<main>
  <section class="card">
    <h2>1. 生成试玩数据</h2>
    <div class="row">
      <label>时长
        <select id="genDuration">
          <option value="30">30 秒</option>
          <option value="60">60 秒</option>
          <option value="120" selected>2 分钟</option>
          <option value="600">10 分钟(基准测试)</option>
        </select>
      </label>
      <label>帧率
        <select id="genFps">
          <option value="45">45 fps</option>
          <option value="90" selected>90 fps</option>
        </select>
      </label>
      <label>分辨率
        <select id="genRes">
          <option value="640x360">640×360</option>
          <option value="1280x720" selected>1280×720</option>
        </select>
      </label>
      <label>种子 <input id="genSeed" type="number" value="1" min="1" max="999"></label>
      <label>运动强度 <input id="genAggr" type="range" min="5" max="100" value="70"></label>
      <button id="btnGen">生成试玩数据</button>
    </div>
    <div class="progress" id="genProgress"><div class="fill"></div><span class="label"></span></div>
    <a id="downloadLink" style="display:none" download></a>
  </section>

  <section class="card">
    <h2>2. 晕动风险分析</h2>
    <div class="row">
      <div id="dropzone">拖入 .vrs 试玩数据文件,或 <label class="link">选择文件<input id="fileInput" type="file" accept=".vrs" hidden></label></div>
      <button id="btnAnalyze" disabled>开始分析</button>
    </div>
    <div class="progress" id="anaProgress"><div class="fill"></div><span class="label"></span></div>

    <div id="results" style="display:none">
      <div class="score-row">
        <div class="score-box">
          <div id="scoreBig">–</div>
          <div id="gradeLabel"></div>
        </div>
        <div id="perfInfo" class="dim"></div>
      </div>
      <h3>风险时间轴(点击区段查看)</h3>
      <canvas id="timeline" width="960" height="180"></canvas>
      <div class="cols">
        <div>
          <h3>高风险区段</h3>
          <div id="segments"></div>
        </div>
        <div>
          <h3>关卡热区图</h3>
          <canvas id="heatmap" width="440" height="340"></canvas>
        </div>
      </div>
      <h3>降风险建议</h3>
      <div id="suggestions"></div>
    </div>
  </section>

  <section class="card">
    <h2>3. 相关性验证(系统评分 vs 30 人问卷)</h2>
    <div class="row">
      <label>会话数
        <select id="valN">
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="20">20</option>
        </select>
      </label>
      <button id="btnVal">运行验证</button>
      <span id="valResult"></span>
    </div>
    <div class="progress" id="valProgress"><div class="fill"></div><span class="label"></span></div>
    <canvas id="scatter" width="480" height="360"></canvas>
  </section>

  <section class="card">
    <h2>日志</h2>
    <pre id="log"></pre>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
